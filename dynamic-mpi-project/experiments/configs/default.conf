# ==============================================================================
# Dynamic MPI Project - Default Experiment Configuration
# ==============================================================================
# This configuration file defines default parameters for baseline, reproduction,
# and adaptive chunking benchmark runs on the HPC cluster.

# --- Problem Domain Parameters ---
# Global 3D grid dimensions
GRID_NX=128
GRID_NY=128
GRID_NZ=128

# Halo boundary thickness (number of ghost cells)
HALO_DEPTH=1

# Number of stencil computation time steps
NUM_ITERATIONS=100

# Warmup iterations before timing begins
WARMUP_ITERATIONS=10

# --- MPI Process Decomposition ---
# Default number of MPI processes (can be overridden via command-line)
MPI_PROCESSES=4

# Cartesian decomposition (px * py * pz must equal MPI_PROCESSES, or 0 for auto)
DECOMP_PX=0
DECOMP_PY=0
DECOMP_PZ=0

# --- Benchmark & Measurement Settings ---
# Number of repetitions per experiment to reduce measurement noise
NUM_RUNS=5

# Enable detailed per-phase timing (0 = summary only, 1 = detailed)
DETAILED_TIMING=1

# --- Adaptive Chunking Settings (Week 3 Extension) ---
# Default chunk size in bytes for intra-node communication
DEFAULT_CHUNK_SIZE=4096
MIN_CHUNK_SIZE=1024
MAX_CHUNK_SIZE=65536

